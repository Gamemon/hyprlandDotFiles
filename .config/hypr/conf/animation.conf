# =============================================================================
# Animation Configuration
# Author: escproxy (github: Gamemon)
# Repository: https://github.com/Gamemon/hyprlandDotFiles
# =============================================================================
#
# Controls the animation curves and speeds for window transitions,
# workspace switching, and border effects.
# =============================================================================

animations {
	enabled = true

	# --- Window Animations ---
	# popin gives windows a slight scale-up effect when opening
	animation = windowsIn,1,4,default,popin 0%
	animation = windowsOut,1,4,default,popin
	animation = windowsMove,1,6,default,slide

	# --- Fade Transitions ---
	# Smooth fade effects for windows, shadows, and dimming
	animation = fadeIn,1,6,default
	animation = fadeOut,1,6,default
	animation = fadeSwitch,1,6,default
	animation = fadeShadow,1,6,default
	animation = fadeDim,1,6,default

	# --- Border Animation ---
	# Speed at which the active border color transitions
	animation = border,1,4,default

	# --- Workspace Animation ---
	# Sliding transition when switching between workspaces
	animation = workspaces,1,6,default,slide
}