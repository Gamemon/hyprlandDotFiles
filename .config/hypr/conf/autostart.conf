# =============================================================================
# Autostart Configuration
# Author: escproxy (github: Gamemon)
# Repository: https://github.com/Gamemon/hyprlandDotFiles
# =============================================================================
#
# Commands that run automatically when Hyprland starts.
# Manages: status bar, notifications, screenshots, wallpaper, and monitor setup.
# =============================================================================

# Start the Waybar status bar
exec-once = waybar

# Start the notification daemon (swaync)
exec-once = swaync

# Start the screenshot tool (flameshot) in the background
exec-once = flameshot

# Auto-detect and configure external monitors on startup
exec-once = ~/.config/hypr/scripts/monitor-auto.sh

# Start the wallpaper engine (Linux Wallpaper Engine)
exec-once = ~/bin/wallpaperengine.sh





