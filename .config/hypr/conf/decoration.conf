# =============================================================================
# Decoration Configuration
# Author: escproxy (github: Gamemon)
# Repository: https://github.com/Gamemon/hyprlandDotFiles
# =============================================================================
#
# Controls window rounding, opacity, blur, and dimming effects.
# =============================================================================

decoration {
	rounding = $hypr_rounding        # Corner radius for windows
	active_opacity = 1.0             # Fully opaque when focused
	inactive_opacity = 0.8           # Slightly transparent when unfocused
	fullscreen_opacity = 1.0         # Full opacity in fullscreen
	dim_inactive = false             # Don't dim unfocused windows
	dim_strength = 0.5               # Dimming intensity (unused when disabled)

	blur {
		enabled = true
		size = 16                    # Blur strength (higher = more blur)
	}
}