# =============================================================================
# Keyboard & Input Configuration
# Author: escproxy (github: Gamemon)
# Repository: https://github.com/Gamemon/hyprlandDotFiles
# =============================================================================
#
# Controls keyboard layout, repeat rate, mouse/touchpad behavior.
#
# Reference: https://wiki.hyprland.org/Configuring/Variables/#input
# =============================================================================

input {
	kb_model =
	kb_layout = us, ru                    # Primary: US English, Secondary: Russian
	kb_variant =
	kb_options = grp:alt_shift_toggle     # Alt+Shift to switch keyboard layout
	kb_rules =
	kb_file =
	numlock_by_default = false
	repeat_rate = 25                       # Characters per second when holding a key
	repeat_delay = 600                     # Milliseconds before repeat starts
	sensitivity = 0.5                     # Mouse sensitivity multiplier
	accel_profile = adaptive              # Mouse acceleration curve
	force_no_accel = false
	left_handed = false
	scroll_method = 2fg                   # Two-finger scrolling on touchpad
	scroll_button = 0
	natural_scroll = false
	follow_mouse = 1                      # Window focus follows mouse
	float_switch_override_focus = 1

	touchpad {
		disable_while_typing = true
		natural_scroll = true
		scroll_factor = 1.0
		middle_button_emulation = false
		clickfinger_behavior = false
		tap-to-click = true
		drag_lock = false
	}

	touchdevice {
		transform = 0
		output =
	}
}
