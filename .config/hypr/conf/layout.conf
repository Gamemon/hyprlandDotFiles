#
# Dwindle layout settings — controls how windows are split and tiled.
# =============================================================================

dwindle {
	pseudotile = false                     # Disable pseudo-tiling mode
	force_split = 0                        # 0 = auto, 1 = horizontal, 2 = vertical
	preserve_split = false                 # Don't preserve split direction
	special_scale_factor = 1               # Scale of special workspace windows
	split_width_multiplier = 1.0           # Affects split ratio
	use_active_for_splits = true           # Split based on active window, not the mouse
}