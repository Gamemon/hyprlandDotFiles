# =============================================================================
# Miscellaneous Settings
# Author: escproxy (github: Gamemon)
# Repository: https://github.com/Gamemon/hyprlandDotFiles
# =============================================================================
#
# Various Hyprland settings: VRR, VFR, DPMS, swallow, and splash.
# =============================================================================

misc {
	disable_hyprland_logo = true           # Hide the Hyprland logo watermark
	disable_splash_rendering = false       # Show splash on startup
	vfr = on                               # Variable frame rate (power saving)
	vrr = 1                                # Variable refresh rate (1 = full)
	mouse_move_enables_dpms = false        # Don't wake screen on mouse movement
	always_follow_on_dnd = true
	layers_hog_keyboard_focus = true
	animate_manual_resizes = false
	disable_autoreload = false             # Auto-reload config on file change
	enable_swallow = false                 # Don't swallow subprocess windows
	swallow_regex =
	focus_on_activate = true
}
