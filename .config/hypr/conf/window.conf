# =============================================================================
# Window Layout & Colors
# Author: escproxy (github: Gamemon)
# Repository: https://github.com/Gamemon/hyprlandDotFiles
# =============================================================================
#
# General window appearance: gaps, borders, and colors.
# Theme variables are sourced from hyprtheme.conf.
# =============================================================================

general {
	gaps_in = $hypr_gaps_in          # Gap between windows in a container
	gaps_out = $hypr_gaps_out        # Gap between container and screen edge
	border_size = $hypr_border_size  # Border thickness in pixels
	layout = dwindle                 # Default tiling layout
	resize_on_border = true          # Resize by dragging on window borders
	col.active_border = $active_border_col_1 $active_border_col_2 $gradient_angle
	col.inactive_border = $inactive_border_col_1
}