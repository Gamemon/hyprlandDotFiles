# =============================================================================
# Window Rules
# Author: escproxy (github: Gamemon)
# Repository: https://github.com/Gamemon/hyprlandDotFiles
# =============================================================================
#
# Per-window overrides for opacity, fullscreen, and workspace placement.
# =============================================================================

# Reduce opacity for terminal and file manager windows
windowrule = opacity 0.93, class:^(Alacritty|thunar)$

# Force fullscreen for communication/collaboration apps
windowrule = fullscreen, class:^(Mattermost|Slack|org.telegram.desktop|thunar)$

# Send these apps to the special overlay workspace
windowrule = workspace special:overlay, class:^(Mattermost|Slack|org.telegram.desktop|thunar)$