#
# Touchpad gesture settings for workspace switching.
# =============================================================================

gestures {
	workspace_swipe = true                # Enable 3-finger swipe to switch workspaces
	workspace_swipe_fingers = 3
	workspace_swipe_distance = 300        # Pixels required for a full swipe
	workspace_swipe_invert = true         # Invert swipe direction
	workspace_swipe_min_speed_to_force = 30
	workspace_swipe_cancel_ratio = 0.5    # How far to swipe back to cancel
	workspace_swipe_create_new = true     # Swipe past last workspace creates a new one
	workspace_swipe_forever = false
}

