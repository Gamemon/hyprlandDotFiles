# =============================================================================
# Hypridle Configuration
# Author: escproxy (github: Gamemon)
# Repository: https://github.com/Gamemon/hyprlandDotFiles
# =============================================================================
#
# Idle daemon config — locks the screen after 30 minutes of inactivity.
# =============================================================================

general {
    lock_cmd = ~/bin/lock.sh                        # Command to lock the session (themed swaylock)
    unlock_cmd = notify-send "unlock!"              # Command run on unlock
    before_sleep_cmd = notify-send "Zzz"            # Notification before sleep
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({action = 'on'})" ; sleep 2 && notify-send "Welcome back!"  # Post-sleep cleanup
    ignore_dbus_inhibit = false                     # Respect dbus idle-inhibit requests (e.g. Firefox, Steam)
    ignore_systemd_inhibit = false                  # Respect systemd-inhibit requests
}

listener {
    timeout = 1800                                  # 30 minutes of inactivity
    on-timeout = ~/bin/lock.sh                      # Trigger lockscreen
    on-resume = notify-send "Welcome back!"         # Notification on resume
}
