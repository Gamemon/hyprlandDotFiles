
# =============================================================================
# Hyprland Configuration
# Author: escproxy (github: Gamemon)
# Repository: https://github.com/Gamemon/hyprlandDotFiles
# =============================================================================
#
# This is the primary Hyprland config. It sources theme/layout
# settings from the conf/ subdirectory via hyprtheme.conf.
#
# Refer to: https://wiki.hypr.land/Configuring/
# =============================================================================


################
### MONITORS ###
################
monitor=,preferred,auto,1
# See https://wiki.hypr.land/Configuring/Monitors/


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nautilus
$menu = wofi --show drun


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
#exec-once = simple-wallpaper-engine --background
exec-once = /usr/lib/kdeconnectd
# Autostart the authentication agent
exec-once = systemctl --user start hyprpolkitagent
exec-once = hyprsunset
exec-once = swaync & hypridle
exec-once = nordvpn c chicago
exec-once = linux-wallpaper-engine
exec-once = ~/.config/eww/scripts/launch_hud.sh
exec-once = [workspace 5 silent] kitty --hold -e sh -c "fastfetch -l ~/.config/fastfetch/altlogo.txt; fastfetch; fastfetch; fastfetch; fastfetch; fastfetch; fastfetch; fastfetch; fastfetch; fastfetch; fastfetch; fastfetch; fastfetch; fastfetch; fastfetch; fastfetch; fastfetch; fastfetch -l ~/.config/fastfetch/logo.txt; fastfetch; lsd; toilet --rainbow Have a good day!"
#exec-once = kitty -e --hold sh -c "figlet 'Welcome' -f slant | cowsay -n -r | lolcat -a"
#exec-once = [workspace 3 silent] kitty -e sh -c "figlet 'Welcome' -f slant | cowsay -n -r | lolcat -a -d 1; read"
exec-once = [workspace 5 silent] kitty --override initial_window_width=120 --override initial_window_height=40 sh -c "fortune | figlet -w 100 -f mini | cowsay -n -r | nms -f magenta; read"
#toilet -w 80 -f future
#exec-once = [workspace 2 silent] kitty sh -c "$(echo -e 'asciiquarium\n~/pond/bin/pond\nhollywood' | shuf -n 1)"
exec-once = [workspace 2 silent] kitty sh -c "$(echo -e 'asciiquarium\nhome/ajohnson269/pond/bin/pond' | shuf -n 1)"
exec-once = [workspace 1 silent] obsidian
exec-once = [workspace 2 silent] spotify-launcher
#exec-once = [workspace 2 silent] kitty  --hold -e cava
exec-once = [workspace 3 silent] kitty --hold -e nvim
#exec-once = [workspace 4 silent] prime-run prismlauncher
exec-once = [workspace 5 silent] kitty --override initial_window_width=40 --override initial_window_height=20 --hold -e 'tty-clock' -C 5 -b -c
# exec-once = [workspace 5 silent] discord
exec-once = [workspace 1 silent] firefox
exec-once = snappy-switcher --daemon

## Auto run via hyprland
exec-once = ~/.config/eww/scripts/audio/ascii_visualizer.py &
exec-once = cava -p ~/.config/cava/config

exec-once = sleep 2; waybar

############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = WLR_DRM_NO_MODIFIERS,1
env = AQ_NO_MODIFIERS,1

env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card2
###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 1
    gaps_out = 1

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(4A00C4BA) rgba(6200C4BA) 45deg
    col.inactive_border = rgba(1A024ABA)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 15
    rounding_power = 1

    # Change transparency of focused and unfocused windows
    #active_opacity = 1.0
    #inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 10
        render_power = 4
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

render {
    direct_scanout = false
}

scrolling {
    fullscreen_on_one_column = true
    column_width = 0.9
    direction = right # Can be set to up, down, left, or right
}

cursor {
    no_hardware_cursors = true
}

workspace = 1, layout:master
workspace = 4, layout:monocle
workspace = 5, layout:scrolling

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]
# ── Eww HUD Global Rules ──────────────────────────────────────
#windowrulev2 = float, class:^(eww-.*)$
#windowrulev2 = workspace 1, class:^(eww-.*)$
#windowrulev2 = noborder, class:^(eww-.*)$
#windowrulev2 = noshadow, class:^(eww-.*)$
#windowrulev2 = nofocus, class:^(eww-.*)$
#windowrulev2 = noinitialfocus, class:^(eww-.*)$
# ── Eww HUD Global Rules (Safe Mode) ──────────────────────────
#windowrulev2 = float, class:^eww
#windowrulev2 = workspace 1 silent, class:^eww
#windowrulev2 = noborder, class:^eww
#windowrulev2 = noshadow, class:^eww
#windowrule = float, eww


# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    #pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    mouse_refocus = true
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
        disable_while_typing = false
    }
}

# https://wiki.hypr.land/Configuring/Variables/#gestures
gestures {
    #workspace_swipe = false;
}

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################
# Copilot Rebind
bindr = SUPER SHIFT CONTROL, Control_R, exec, notify-send "Copilot Key Pressed"

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, M, exec, kill -9 -1 # wah
bind = $mainMod, M, exec, shutdown -h now
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod SHIFT, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, F, fullscreen, 0

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r
bind = $SUPER_SHIFT, j, layoutmsg, swapwithmaster
bind = $SUPER_SHIFT, left, movewindow, l
bind = $SUPER_SHIFT, up, movewindow, u
bind = $SUPER_SHIFT, down, movewindow, d
bind = $SUPER_SHIFT, right, movewindow, r

bind = $SUPER_SHIFT, mouse_up, layoutmsg, splitratio +0.1
bind = $SUPER_SHIFT, mouse_down, layoutmsg, splitratio -0.1

bind = , PRINT, exec, hyprshot -m window
bind = shift, PRINT, exec, hyprshot -m region
bind = $SUPER_SHIFT, l, exec, ~/bin/lock.sh

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Alt tabbing finally
bind = ALT, Tab, exec, snappy-switcher next
bind = ALT SHIFT, Tab, exec, snappy-switcher prev

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl=,switch:on:Lid Switch, exec, ~/bin/lock.sh
bindl=,switch:off:Lid Switch, exec, hyprctl dispatch dpms on


##############################
### WINDOWS AND WORKSPACES ###
##############################

xwayland {
    force_zero_scaling = true
}
