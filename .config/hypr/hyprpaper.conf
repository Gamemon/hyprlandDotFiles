# =============================================================================
# Hyprpaper Configuration
# Author: escproxy (github: Gamemon)
# Repository: https://github.com/Gamemon/hyprlandDotFiles
# =============================================================================
#
# Wallpaper daemon config.
# Preloads the desktop wallpaper and sets it across all monitors.
# =============================================================================

# Preload the wallpaper image into memory so it can be applied instantly
preload = /home/escproxy/Pictures/DESKTOPWALLPAPER.jpg

# Set the wallpaper on all monitors (empty before comma = all monitors)
wallpaper = ,/home/escproxy/Pictures/DESKTOPWALLPAPER.jpg

# Disable the splash text overlay
splash = false

# Enable IPC so hyprctl can dynamically change wallpapers at runtime
ipc = on
