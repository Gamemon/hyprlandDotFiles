# =============================================================================
# Hyprsunset Configuration
# Author: escproxy (github: Gamemon)
# Repository: https://github.com/Gamemon/hyprlandDotFiles
# =============================================================================
#
# Blue light filter config — automatically adjusts color temperature
# based on time of day (day/night profiles).
# =============================================================================

# Default settings (used when no profile matches)
temperature = 6000
gamma = 1.0
identity = false

# Daytime profile — neutral temperature, normal brightness
profile {
  name = "day"
  time = 07:30
  temperature = 6000
  gamma = 1.0
  identity = true
}

# Nighttime profile — warmer temperature, reduced brightness
profile {
  name = "night"
  time = 21:00
  temperature = 4500
  gamma = 0.8
}

