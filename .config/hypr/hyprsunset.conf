# Example hyprsunset.conf
# ~/.config/hypr/hyprsunset.conf

# Main settings
temperature = 6000
gamma = 1.0
identity = false

# Daytime profile
profile {
  name = "day"
  time = 07:30
  temperature = 6000 # Neutral temperature
  gamma = 1.0 # Normal brightness
  identity = true
}

# Nighttime profile
profile {
  name = "night"
  time = 21:00
  temperature = 4500 # Warmer color
  gamma = 0.8 # 80% brightness
}

