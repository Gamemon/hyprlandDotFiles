# =============================================================================
# Hyprland Theme Variables
# Author: escproxy (github: Gamemon)
# Repository: https://github.com/Gamemon/hyprlandDotFiles
# =============================================================================
#
# Theme variables consumed by window.conf, decoration.conf, etc.
# Uses the Kanagawa color palette.
# =============================================================================

# ---- Layout & Spacing ----
$hypr_border_size = 2   # Window border thickness in pixels
$hypr_gaps_in = 5       # Gap between windows inside a container
$hypr_gaps_out = 10     # Gap between containers and screen edges
$hypr_rounding = 10     # Window corner rounding radius

# ---- Colors (Kanagawa Palette) ----
$gradient_angle = 45deg
$active_border_col_1 = 0xFF957FB8   # Active border color (top-left)
$active_border_col_2 = 0xFFDCA7A7   # Active border color (bottom-right, gradient)
$inactive_border_col_1 = 0xFF1F1F23  # Inactive border color
$inactive_border_col_2 = 0xFF1F1F23  # Inactive border color (unused fallback)

# ---- Shadow Colors ----
$active_shadow_col = 0x66000000
$inactive_shadow_col = 0x66000000

# ---- Group/Tab Border Colors ----
$group_border_col = 0xFFE46876
$group_border_active_col = 0xFF98BB6C